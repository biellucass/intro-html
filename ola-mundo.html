<!-- DOCTYPE - serve para indicador aos navegadores qual padrão de html está sendo ultilizado -->


<!DOCTYPE html>
<!-- Html - Elemento raiz. Tudo que pertence ao documento html fica dentro dele -->

<!-- Atributo responsável pela linguagem do conteúdo do site, além disso tem um imacto muito na acessibilidade e Ceo -->
<html lang="pt-br">


    <head>
        <!-- charset: essa configuração serve para indicar ao navegador qual padrão/codificação de caracteres usar. Isso permite ultilizar palavras com assentos, caracteres especiais e emojis -->
        <meta charset="UTF-8">

        <!-- ele determina a responsibilidade do site para diferentes telas -->
        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <title>Olá mundo</title>
    </head>
    
    <!-- body: conteudo da página, todo conteudo visivel do documento onde o usuario interage e consume recursos da página. por exemplo: títulos, parágrafos, imagens, vídeos, formulários e etc. -->
    <body>
        <h1>Olá Mundo</h1>
    </body>
</html>
